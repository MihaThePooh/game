<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="hub-id" content="">
<meta name="hub-home" content="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff0ea">
<title>Драконий бег</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #cfe6dd;
  font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
  color: #22312c;
  -webkit-user-select: none;
  user-select: none;
}

/* Игра занимает весь экран; всё остальное лежит поверх холста. */
#wrap { position: relative; width: 100%; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#hud {
  position: absolute;
  top: calc(10px + env(safe-area-inset-top));
  left: 0; right: 0;
  display: flex;
  gap: 14px;
  /* Слева отступ под бургер: без него счёт прячется под кнопку. */
  padding: 12px 14px 0 calc(68px + env(safe-area-inset-left));
  font-variant-numeric: tabular-nums;
  font-size: 15px;
  color: #2c4740;
  pointer-events: none;
}
#best { margin-left: auto; opacity: .65; }

/* Бургер. Единственная кнопка на экране, поэтому крупная и тёмная:
   ребёнок должен видеть её сразу, а не искать. */
#burger {
  position: absolute;
  top: calc(10px + env(safe-area-inset-top));
  left: calc(10px + env(safe-area-inset-left));
  width: 46px; height: 46px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: #2c4740;
  box-shadow: 0 4px 12px rgba(20, 50, 40, .28);
  cursor: pointer;
}
#burger span { width: 22px; height: 3px; border-radius: 2px; background: #eaf5f0; }
#burger:active { transform: scale(.94); }

/* Само меню. Затемнение на весь экран, карточка по центру. */
#menu {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(18, 40, 34, .42);
  z-index: 5;
}
#menu[hidden] { display: none; }
#menuBox {
  width: 100%;
  max-width: 340px;
  max-height: 86%;
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  background: #f4faf7;
  box-shadow: 0 18px 46px rgba(15, 40, 32, .3);
  overflow: hidden;
}
.mhead {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 10px 10px 12px;
  border-bottom: 1px solid #dbe9e3;
}
.mhead b { flex: 1; font-size: 16px; font-weight: 600; }
.mhead button {
  width: 32px; height: 32px;
  border: 0;
  border-radius: 9px;
  background: #e3f0ea;
  color: #2c4740;
  font: inherit;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.mhead button[hidden] { display: none; }
#mbody { padding: 8px; overflow: auto; }

/* Строка списка: превью слева, название справа. */
.mrow {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px;
  margin-bottom: 6px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  color: #22312c;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.mrow:last-child { margin-bottom: 0; }
.mrow.on { background: #e3f0ea; }
.mrow.install { background: #e3f0ea; }
.mrow.install.done { background: none; cursor: default; }
.mrow canvas { width: 62px; height: 46px; flex: 0 0 auto; }
.mrow i { margin-left: auto; font-style: normal; opacity: .35; }
.mrow small { display: block; opacity: .6; font-size: 12px; }

/* Карточка существа. */
.mcard canvas { width: 100%; height: 120px; }
.mcard p { margin: 6px 2px 12px; font-size: 14px; line-height: 1.45; }
.mcard h4 {
  margin: 0 2px 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  opacity: .5;
}
.mcard dl { margin: 0 0 14px; font-size: 14px; }
.mcard dt { font-weight: 600; }
.mcard dd { margin: 0 0 7px; opacity: .72; }
.mplay {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 12px;
  background: #2c4740;
  color: #eaf5f0;
  font: inherit;
  font-size: 15px;
  cursor: pointer;
}
.mplay:disabled { background: #cfe0d8; color: #6a8279; }

#msg {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  padding: 0 24px;
  pointer-events: none;
}
#msg b { font-size: 26px; font-weight: 600; }
#msg small { font-size: 14px; opacity: .7; }
#msg.gone { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score">0</div>
    <div id="best">рекорд 0</div>
  </div>

  <div id="msg">
    <b>Драконий бег</b>
    <small id="как">тап или пробел — прыжок</small>
    <small style="opacity:.45">версия 6 · вход через хаб</small>
  </div>

  <button id="burger" aria-label="Меню"><span></span><span></span><span></span></button>

  <div id="menu" hidden>
    <div id="menuBox">
      <div class="mhead">
        <button id="mback" hidden aria-label="Назад">&#8249;</button>
        <b id="mtitle">Меню</b>
        <button id="mclose" aria-label="Закрыть">&times;</button>
      </div>
      <div id="mbody"></div>
    </div>
  </div>
</div>

<script>
/* Сама игра. Запускает её облако ниже — после того, как рекорд и дракон
   сверены с сервером: иначе первый кадр показал бы чужой или старый рекорд. */
window.игра = function () {
  'use strict';

  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  /* --- размеры ---------------------------------------------------------
     Холст держим в CSS-пикселях: рисовать удобнее в них, а чёткость даёт
     масштаб контекста под плотность экрана. */
  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ground = Math.min(H - 70, H * 0.78);
  }
  window.addEventListener('resize', fit);

  /* --- мир ------------------------------------------------------------- */

  var ground = 0;          // высота земли в пикселях от верха
  var state = 'menu';      // menu | run | over
  var score = 0, best = 0, speed = 0, dist = 0, night = 0;
  var hero = null, things = [], puffs = [], last = 0, spawnIn = 0;

  var G = 2100;            // ускорение падения, px/с²
  var JUMP = -860;         // толчок вверх

  // Потолок полёта. Выше — уже за краем экрана, и препятствия там не
  // видно: пусть крылатый упирается в невидимую границу, а не улетает.
  // 330 — это в удобном вертикальном окне; в низком (телефон боком)
  // столько просто нет, поэтому берём то, что меньше.
  var НЕБО = -330;

  function потолок() {
    var рост = beast().h;
    return Math.max(НЕБО, рост + 10 - ground);
  }
  // Насколько сплющивается ползущий: и рисунок, и рамка столкновений.
  var ПОЛЗКОМ = 0.42;
  // Двойное нажатие считается двойным, если уложились в это время.
  var ДВОЙНОЕ = 280;

  try { best = parseInt(localStorage.getItem('run-best') || '0', 10) || 0; }
  catch (e) { best = 0; }

  function reset() {
    score = 0; dist = 0; speed = 250; night = 0;
    things = []; puffs = [];
    spawnIn = 900;   // фора на старте: первое препятствие не в лицо
    // fly — насколько герой «в воздухе» с точки зрения анимации: не
    // прыгнул/не прыгнул, а плавная величина 0..1. По ней раскрываются
    // крылья и поджимаются лапы, иначе переход выглядит как рывок.
    hero = {
      x: 0, y: 0, vy: 0, onGround: true, hold: false, полный: false, t: 0, fly: 0,
      // Полёт крылатых: держит палец — летит на выбранной высоте и
      // рулит ею, двигая палец вверх и вниз. Отпустил — падает.
      // Без этого игра ломается: можно было бы просто висеть над всем.
      парит: false, цель: 0, палец: 0,
      // Ползком — для бескрылого: пока палец на экране, он прижат
      // к земле. Плавная величина 0..1, чтобы не дёргался.
      ползёт: false, низко: 0
    };
  }

  /* --- ввод ------------------------------------------------------------ */

  function jump() {
    if (state === 'menu') { start(); return; }
    if (state === 'over') { start(); return; }
    if (!hero.onGround) { return; }
    hero.vy = JUMP;
    hero.onGround = false;
    hero.hold = true;
    hero.ползёт = false;
    hero.полный = false;
    for (var i = 0; i < 9; i++) { puff(64, ground); }
  }

  function release() {
    // Отпустил рано — прыжок ниже. Короткий тап и долгое нажатие должны
    // ощущаться по-разному, иначе управление кажется деревянным.
    hero.hold = false;
    // Кроме прыжка с двойного тапа: второе нажатие там всегда короткое,
    // и с обрезкой скорости получался подскок на 31 пиксель — ниже
    // любого камня. Такой прыжок отрабатывает на полную.
    if (hero && hero.полный) { return; }
    if (hero && hero.vy < -360) { hero.vy = -360; }
  }

  /* Управление у крылатых и бескрылого разное — так просил Михаил.

     крылатый:  тап — прыжок
                тап в воздухе — полёт, и пока палец на экране,
                высота идёт за пальцем
     бескрылый: палец на экране — ползёт по земле
                двойной тап — прыжок

     Общее правило: разбор нажатия живёт здесь, а физика — в step().
     Смешивать их — верный способ получить героя, который прыгает
     дважды за одно касание. */
  var прошлыйТап = 0;

  function крылатый() {
    return beast().крылья !== false;
  }

  function вниз(y) {
    if (state === 'pause') { return; }         // открыто меню — мир стоит
    if (state !== 'run') { jump(); return; }   // из меню и с экрана «конец»

    var теперь = Date.now();
    var двойной = теперь - прошлыйТап < ДВОЙНОЕ;
    прошлыйТап = теперь;
    // С клавиатуры координаты пальца нет — высоту там правят стрелками.
    hero.палец = (y === null ? hero.палец : y);

    if (крылатый()) {
      if (hero.onGround) { jump(); return; }
      // Второй тап в воздухе — переходим в полёт с текущей высоты.
      hero.парит = true;
      hero.цель = hero.y;
      hero.vy = 0;
      return;
    }

    // Бескрылый.
    if (двойной) { hero.ползёт = false; jump(); hero.полный = true; return; }
    if (hero.onGround) { hero.ползёт = true; }
  }

  function вверх() {
    release();
    // Палец ушёл — полёт кончился, дальше падение. Ползти тоже
    // перестаём: прижатым он остаётся ровно пока держишь.
    hero.парит = false;
    hero.ползёт = false;
  }

  function ведёт(y) {
    if (!hero || !hero.парит) { return; }
    // Сдвиг пальца переносится в высоту один к одному: так понятнее,
    // чем скорость набора — палец где, там и дракон.
    hero.цель += y - hero.палец;
    hero.палец = y;
    var верх = потолок();
    if (hero.цель < верх) { hero.цель = верх; }
    if (hero.цель > 0) { hero.цель = 0; }
  }

  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); вниз(e.clientY); });
  cv.addEventListener('pointermove', function (e) { ведёт(e.clientY); });
  cv.addEventListener('pointerup', вверх);
  cv.addEventListener('pointercancel', вверх);

  // Клавиатура — для проверки с ноутбука. Пробел работает как палец,
  // стрелки заменяют его движение вверх-вниз в полёте.
  var ТАП = { Space: 1, KeyW: 1 };
  var ШАГ = 26;                       // на сколько пикселей двигает стрелка
  window.addEventListener('keydown', function (e) {
    var парит = hero && hero.парит;
    if (e.code === 'ArrowDown' && парит) { e.preventDefault(); ведёт(hero.палец + ШАГ); return; }
    if (e.code === 'ArrowUp' && парит) { e.preventDefault(); ведёт(hero.палец - ШАГ); return; }
    if (ТАП[e.code] || e.code === 'ArrowUp') {
      e.preventDefault();
      // Зажатую клавишу браузер повторяет — без этой проверки одно
      // нажатие насчитало бы десяток «двойных тапов».
      if (!e.repeat) { вниз(null); }
    }
  });
  window.addEventListener('keyup', function (e) {
    if (ТАП[e.code] || e.code === 'ArrowUp') { вверх(); }
  });

  function start() {
    reset();
    state = 'run';
    document.getElementById('msg').className = 'gone';
    закрытьМеню();
    last = 0;
  }

  function over() {
    state = 'over';
    if (score > best) {
      best = score;
      try { localStorage.setItem('run-best', String(best)); } catch (e) { /* приват — не беда */ }
      window.облако.сохранить();
    }
    var m = document.getElementById('msg');
    m.className = '';
    m.innerHTML = '<b>' + score + '</b><small>рекорд ' + best + ' · тап — ещё раз</small>';
  }

  /* --- препятствия ----------------------------------------------------- */

  function spawn() {
    // Летун появляется только когда уже разогнались: на медленной
    // скорости он получается несправедливым.
    var flying = speed > 330 && Math.random() < 0.3;
    // Навес — низкая перекладина сверху: пройти можно только прижавшись
    // к земле или взяв верхом. Идёт с первой же секунды наравне с
    // кочками: игра, в которой полминуты только прыгаешь, скучная.
    var навес = !flying && Math.random() < 0.34;
    // Заслон в небе — там, где летают. Без него полёт делал бы игру
    // бессмысленной: поднялся повыше и лети над всем.
    var заслон = flying && Math.random() < 0.45;

    if (навес) {
      // Просвет считаем от роста существа в положении лёжа, а не числом
      // из головы: у волка и у двуногого разная высота, и фиксированная
      // щель для одного была бы непроходимой.
      var щель = Math.round(beast().h * ПОЛЗКОМ) + 20;
      things.push({
        kind: 'arch', x: W + 40, y: ground - щель,
        w: 58, h: 150, t: 0
      });
    } else if (заслон) {
      // Ставим на высоте, куда как раз забирается крылатый. Верхнюю
      // границу держим ниже потолка: иначе получится заслон, который
      // нечем облететь.
      var верх = 170 + Math.random() * 90;
      things.push({
        kind: 'bird', x: W + 40, y: ground - верх,
        w: 56, h: 44, t: Math.random() * 6
      });
    } else if (flying) {
      // Низкий летун. Крылатый его перепрыгивает или облетает, а
      // бескрылому прыгать некуда — он проходит понизу. Значит, для
      // бескрылого летун обязан висеть выше его роста лёжа, иначе
      // препятствие получается без единого решения.
      var лёжа = beast().h * ПОЛЗКОМ;
      var низ = крылатый() ? 96 : Math.round(лёжа + 60);
      things.push({
        kind: 'bird', x: W + 40, y: ground - низ - Math.random() * 38,
        w: 56, h: 44, t: Math.random() * 6
      });
    } else {
      var big = Math.random() < 0.35;
      things.push({
        kind: 'rock', x: W + 40, y: ground,
        w: big ? 48 : 34, h: big ? 62 : 42, t: 0
      });
    }
    // Зазор считаем во времени, а не в пикселях: иначе на разгоне
    // препятствия сходятся в непроходимую стену.
    spawnIn = (0.85 + Math.random() * 0.75) * (420 / speed) * 1000;
  }

  function puff(x, y) {
    puffs.push({ x: x + Math.random() * 16, y: y - Math.random() * 6,
                 r: 3 + Math.random() * 5, a: .5 });
  }

  /* --- столкновения ----------------------------------------------------
     Прямоугольники ужимаем: по краям рисунка почти всегда пустота, и без
     запаса игра «убивает» за промах, которого не видно. */
  function hits(a, b) {
    var m = 6;
    return a.x + m < b.x + b.w - m && a.x + a.w - m > b.x + m &&
           a.y + m < b.y + b.h - m && a.y + a.h - m > b.y + m;
  }

  /* --- шаг мира -------------------------------------------------------- */

  function step(dt) {
    if (state !== 'run') { return; }

    dist += speed * dt;
    speed = Math.min(620, 250 + dist / 90);
    score = Math.floor(dist / 22);
    night = (Math.sin(dist / 2600) + 1) / 2;   // плавная смена времени суток

    hero.t += dt * (speed / 250);
    // Крылья раскрываются не мгновенно: тянемся к цели, а не прыгаем в неё.
    hero.fly += ((hero.onGround ? 0 : 1) - hero.fly) * Math.min(1, dt * 7);
    // Прижатость к земле тоже тянем плавно, иначе на каждом касании
    // дракон схлопывается рывком.
    hero.низко += ((hero.ползёт && hero.onGround ? 1 : 0) - hero.низко)
                  * Math.min(1, dt * 12);

    if (hero.парит) {
      // В полёте тяжести нет: высота идёт за пальцем, но не мгновенно —
      // иначе дракон телепортируется и столкновения выглядят нечестно.
      var верхНеба = потолок();
      if (hero.цель < верхНеба) { hero.цель = верхНеба; }   // окно могли уменьшить
      hero.y += (hero.цель - hero.y) * Math.min(1, dt * 9);
      hero.vy = 0;
      hero.onGround = false;
    } else {
      hero.vy += G * dt * (hero.hold && hero.vy < 0 ? 0.62 : 1);
      hero.y += hero.vy * dt;
    }
    if (hero.y >= 0) {
      hero.y = 0; hero.vy = 0; hero.onGround = true;
      hero.hold = false; hero.парит = false;
    }

    spawnIn -= dt * 1000;
    if (spawnIn <= 0) { spawn(); }

    // У каждого существа своя стать, поэтому рамка берётся от него.
    var bw = beast().w;
    var bh = beast().h;
    // Прижатый занимает меньше по высоте — в этом весь смысл ползти
    // под навесом. Рамка обязана сжиматься вместе с рисунком, иначе
    // игра убивает за то, чего на экране не видно.
    bh *= 1 - hero.низко * (1 - ПОЛЗКОМ);
    // Вытянулся вперёд — рамка тоже. Иначе рисунок и расчёт разъезжаются
    // ровно в тот момент, когда игрок жмётся к препятствию: у змея лёжа
    // голова уходит далеко вперёд, и без этого она проходила бы сквозь
    // камни насквозь.
    bw *= 1 + hero.низко * (beast().сам_ляжет ? 0.55 : 0.3);
    var box = { x: 66, y: ground - bh + hero.y, w: bw, h: bh };
    for (var i = things.length - 1; i >= 0; i--) {
      var o = things[i];
      o.x -= speed * dt;
      o.t += dt;
      // У летуна в y хранится верх, у камня и навеса — низ: камень
      // стоит на земле, навес свисает, и обоим удобнее считаться от
      // нижнего края.
      var верх = o.kind === 'bird' ? o.y : o.y - o.h;
      var ob = { x: o.x, y: верх, w: o.w, h: o.h };
      if (hits(box, ob)) { return over(); }
      if (o.x < -80) { things.splice(i, 1); }
    }

    for (var j = puffs.length - 1; j >= 0; j--) {
      var p = puffs[j];
      p.x -= speed * dt * 0.6;
      p.a -= dt * 1.2;
      p.r += dt * 8;
      if (p.a <= 0) { puffs.splice(j, 1); }
    }

    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = 'рекорд ' + Math.max(best, score);
  }

  /* --- рисование ------------------------------------------------------- */

  function mix(a, b, k) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ','
                  + Math.round(a[1] + (b[1] - a[1]) * k) + ','
                  + Math.round(a[2] + (b[2] - a[2]) * k) + ')';
  }

  function sky() {
    var top = mix([223, 240, 234], [58, 74, 96], night);
    var bot = mix([246, 240, 226], [92, 104, 122], night);
    var g = ctx.createLinearGradient(0, 0, 0, ground);
    g.addColorStop(0, top);
    g.addColorStop(1, bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, ground);

    // Холмы за спиной едут медленнее героя — отсюда ощущение глубины.
    var off = (dist * 0.25) % 420;
    ctx.fillStyle = mix([176, 209, 194], [70, 88, 104], night);
    for (var k = -1; k < W / 420 + 1; k++) {
      var bx = k * 420 - off;
      ctx.beginPath();
      ctx.moveTo(bx, ground);
      ctx.quadraticCurveTo(bx + 110, ground - 96, bx + 220, ground);
      ctx.quadraticCurveTo(bx + 310, ground - 58, bx + 420, ground);
      ctx.fill();
    }
  }

  function land() {
    ctx.fillStyle = mix([206, 190, 158], [64, 66, 74], night);
    ctx.fillRect(0, ground, W, H - ground);
    ctx.strokeStyle = mix([150, 134, 106], [40, 44, 52], night);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, ground + 1);
    ctx.lineTo(W, ground + 1);
    ctx.stroke();

    // Камешки на дороге: без них скорость на глаз не читается.
    ctx.fillStyle = mix([176, 158, 126], [52, 56, 64], night);
    var off = dist % 90;
    for (var i = -1; i < W / 90 + 1; i++) {
      var x = i * 90 - off;
      ctx.fillRect(x, ground + 14, 16, 3);
      ctx.fillRect(x + 44, ground + 30, 9, 3);
    }
  }

  /* --- дракон, нарисованный кодом --------------------------------------
     Ростом втрое выше прежнего лисёнка. Собран не из готовых фигур, а из
     костей: у каждой свой угол и длина, и каждая следующая начинается
     там, где кончилась предыдущая. Бедро тянет за собой голень, голень —
     стопу, крыло гнётся в плече и в запястье. Анимация задаёт только
     углы — форма получается сама, поэтому бег и полёт это одно и то же
     тело в разных позах, а не два разных рисунка.

     Система координат: (0,0) — земля под драконом, x вперёд, y вверх
     отрицательный. Скелет уложен в ширину w из списка существ: то, что
     торчит за неё (морда, хвост, крылья), висит выше препятствий и в
     столкновениях не участвует. */

  var DR = {
    far:   '#3a2359',        // дальняя сторона тела — глубже в тень
    farLo: '#4a2f6e',
    body:  '#5b3a8e',
    lit:   '#8159cc',        // освещённая спина
    belly: '#d3b0f5',
    ridge: '#b07de8',
    web:   'rgba(154,101,216,.88)',
    webFar:'rgba(96,60,148,.85)',
    horn:  '#f0e6ff',
    eye:   '#ffd23f'
  };

  function lerp(a, b, k) { return a + (b - a) * k; }

  // Кость-капсула: отрезок с круглыми концами. Возвращает свой конец,
  // чтобы следующей кости было от чего расти.
  function bone(x, y, ang, len, w, col) {
    var nx = x + Math.cos(ang) * len;
    var ny = y + Math.sin(ang) * len;
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(nx, ny);
    ctx.stroke();
    return [nx, ny];
  }

  /* Задняя лапа: бедро -> голень -> стопа. swing качает её при беге,
     tuck поджимает в полёте. */
  function leg(hx, hy, swing, tuck, col) {
    var th = lerp(1.75 + swing * 0.42, 2.55, tuck);
    var sh = lerp(1.15 - swing * 0.62, -0.85, tuck);
    var ft = lerp(0.2 + swing * 0.3, 0.1, tuck);
    var knee = bone(hx, hy, th, 44, 17, col);
    var ankle = bone(knee[0], knee[1], sh, 48, 12, col);
    var toe = bone(ankle[0], ankle[1], ft, 18, 10, col);
    // когти
    ctx.lineWidth = 3;
    ctx.strokeStyle = DR.horn;
    for (var i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(toe[0], toe[1]);
      ctx.lineTo(toe[0] + 7 + i, toe[1] + 3 + i * 2.5);
      ctx.stroke();
    }
  }

  /* Передняя лапа — короткая, как у ящера. */
  function arm(sx, sy, swing, tuck, col) {
    var up = lerp(1.55 - swing * 0.4, 2.3, tuck);
    var fo = lerp(0.95 + swing * 0.5, -1.0, tuck);
    var el = bone(sx, sy, up, 22, 11, col);
    var wr = bone(el[0], el[1], fo, 20, 8, col);
    ctx.strokeStyle = DR.horn;
    ctx.lineWidth = 2.5;
    for (var i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(wr[0], wr[1]);
      ctx.lineTo(wr[0] + 6 + i * 1.5, wr[1] + 4 + i * 3);
      ctx.stroke();
    }
  }

  /* Крыло: плечо -> предплечье -> три пальца, между ними натянута
     перепонка. fly = 0 — сложено на спине, 1 — расправлено; flap — сам
     взмах. Промежуточные значения дают раскрытие, а не переключение. */
  function wing(rx, ry, fly, flap, col, web, k) {
    k = k || 1;
    var hA = lerp(3.35, -2.15 + flap * 0.42, fly);
    var fA = lerp(-0.2, -0.55 + flap * 0.8, fly);
    var hL = lerp(34, 52, fly) * k;
    var fL = lerp(30, 58, fly) * k;

    var ex = rx + Math.cos(hA) * hL, ey = ry + Math.sin(hA) * hL;
    var wx = ex + Math.cos(fA) * fL, wy = ey + Math.sin(fA) * fL;

    var f = [[lerp(3.30, 2.75 - flap * 0.18, fly), lerp(26, 72, fly) * k],
             [lerp(3.42, 2.35 - flap * 0.14, fly), lerp(23, 64, fly) * k],
             [lerp(3.54, 1.95 - flap * 0.10, fly), lerp(19, 52, fly) * k]];
    var tip = [];
    for (var i = 0; i < 3; i++) {
      tip.push([wx + Math.cos(f[i][0]) * f[i][1],
                wy + Math.sin(f[i][0]) * f[i][1]]);
    }

    // Перепонка: передняя кромка по костям, задняя — провисающими дугами
    // между кончиками пальцев. Прямые линии выдали бы фанеру.
    ctx.fillStyle = web;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(ex, ey);
    ctx.lineTo(wx, wy);
    ctx.lineTo(tip[0][0], tip[0][1]);
    for (var j = 1; j < 3; j++) {
      var px = (tip[j - 1][0] + tip[j][0]) / 2 - (wx - tip[j][0]) * 0.12;
      var py = (tip[j - 1][1] + tip[j][1]) / 2 - (wy - tip[j][1]) * 0.12;
      ctx.quadraticCurveTo(px, py, tip[j][0], tip[j][1]);
    }
    ctx.quadraticCurveTo((tip[2][0] + rx) / 2, (tip[2][1] + ry) / 2 + 10, rx, ry);
    ctx.closePath();
    ctx.fill();

    bone(rx, ry, hA, hL, 9 * k, col);
    bone(ex, ey, fA, fL, 7 * k, col);
    for (var i2 = 0; i2 < 3; i2++) {
      bone(wx, wy, f[i2][0], f[i2][1], 4.5 * k, col);
    }
  }

  /* Голова целиком в своей системе координат: повернули один раз, дальше
     рисуем прямо. */
  function head(x, y, ang, glow) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);

    // череп
    ctx.fillStyle = DR.body;
    ctx.beginPath();
    ctx.ellipse(0, 0, 19, 15, 0, 0, 6.3);
    ctx.fill();

    // морда
    ctx.beginPath();
    ctx.moveTo(4, -11);
    ctx.quadraticCurveTo(26, -12, 34, -3);
    ctx.quadraticCurveTo(28, 5, 20, 6);
    ctx.lineTo(4, 10);
    ctx.closePath();
    ctx.fill();

    // нижняя челюсть светлее — иначе морда читается плоским пятном
    ctx.fillStyle = DR.belly;
    ctx.beginPath();
    ctx.moveTo(3, 6);
    ctx.quadraticCurveTo(18, 9, 27, 4);
    ctx.quadraticCurveTo(16, 15, 2, 13);
    ctx.closePath();
    ctx.fill();

    // рога, отведённые назад
    ctx.strokeStyle = DR.horn;
    ctx.lineCap = 'round';
    [[-0.35, 30, 6], [-0.05, 22, 4.5]].forEach(function (h) {
      ctx.lineWidth = h[2];
      ctx.beginPath();
      ctx.moveTo(-6, -9);
      ctx.quadraticCurveTo(-14 - h[1] * 0.4, -14 - h[1] * 0.3,
                           -8 - h[1], -18 - h[1] * 0.5 + h[0] * 10);
      ctx.stroke();
    });

    // гребень на щеке
    ctx.fillStyle = DR.ridge;
    ctx.beginPath();
    ctx.moveTo(-4, 4);
    ctx.lineTo(-20, 14);
    ctx.lineTo(-3, 12);
    ctx.closePath();
    ctx.fill();

    // глаз: свечение делаем градиентом, а не тенью — предсказуемее и дешевле
    var g = ctx.createRadialGradient(7, -4, 1, 7, -4, 13);
    g.addColorStop(0, 'rgba(255,226,120,.95)');
    g.addColorStop(1, 'rgba(255,210,63,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(7, -4, 13, 0, 6.3);
    ctx.fill();

    ctx.fillStyle = DR.eye;
    ctx.beginPath();
    ctx.ellipse(7, -4, 6, 5 * glow, 0, 0, 6.3);
    ctx.fill();
    ctx.fillStyle = '#2a1030';
    ctx.beginPath();
    ctx.ellipse(8.5, -4, 1.8, 4.4 * glow, 0, 0, 6.3);
    ctx.fill();

    // ноздря
    ctx.fillStyle = '#31183f';
    ctx.beginPath();
    ctx.ellipse(27, -5, 2.2, 1.6, 0, 0, 6.3);
    ctx.fill();

    ctx.restore();
  }

  function dragon(t, run, fly, lift) {
    var p = run ? t * 9 : t * 2.2;
    var swing = Math.sin(p);
    var flap = Math.sin(t * (fly > 0.5 ? 15 : 5));
    var bob = run ? Math.sin(p * 2) * 3 : Math.sin(t * 2) * 1.5;

    // Тень на земле: герой поднялся — она уменьшается и бледнеет.
    var k = Math.max(0, 1 - lift / 240);
    ctx.fillStyle = 'rgba(58,35,89,' + (0.22 * k) + ')';
    ctx.beginPath();
    ctx.ellipse(30, lift - 3, 46 * (0.55 + k * 0.45), 8 * k + 2, 0, 0, 6.3);
    ctx.fill();

    ctx.save();
    // В воздухе дракон задирает нос. Поворачиваем вокруг таза, а не
    // вокруг ног: иначе он проваливается сквозь землю.
    ctx.translate(22, -100 + bob);
    ctx.rotate(-0.17 * fly);
    ctx.translate(-22, 100);

    // 1. дальнее крыло — за спиной
    wing(26, -132, fly, Math.sin(t * (fly > 0.5 ? 15 : 5) - 0.5), DR.farLo, DR.webFar);

    // 2. хвост
    var tx = 8, ty = -102, ang = 3.18;
    for (var i = 0; i < 4; i++) {
      ang += 0.13 + Math.sin(p - i * 0.7) * 0.1;
      var nx = tx + Math.cos(ang) * 13, ny = ty + Math.sin(ang) * 13;
      ctx.strokeStyle = i < 2 ? DR.body : DR.farLo;
      ctx.lineWidth = 15 - i * 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(nx, ny);
      ctx.stroke();
      tx = nx; ty = ny;
    }
    ctx.fillStyle = DR.ridge;
    ctx.beginPath();
    ctx.moveTo(tx + 6, ty - 1);
    ctx.lineTo(tx - 14, ty - 11);
    ctx.lineTo(tx - 10, ty + 9);
    ctx.closePath();
    ctx.fill();

    // 3. дальние лапы — темнее, они в тени тела
    leg(20, -100, -swing, fly, DR.far);
    arm(44, -118, -swing, fly, DR.far);

    // 4. туловище
    var g = ctx.createLinearGradient(0, -146, 0, -78);
    g.addColorStop(0, DR.lit);
    g.addColorStop(0.5, DR.body);
    g.addColorStop(1, DR.belly);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(6, -100);
    ctx.quadraticCurveTo(14, -142, 40, -140);
    ctx.quadraticCurveTo(56, -137, 58, -116);
    ctx.quadraticCurveTo(59, -98, 46, -88);
    ctx.quadraticCurveTo(28, -80, 16, -86);
    ctx.quadraticCurveTo(6, -90, 6, -100);
    ctx.fill();

    // складки на брюхе
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 2;
    for (var b = 0; b < 4; b++) {
      ctx.beginPath();
      ctx.moveTo(18 + b * 9, -86 - b * 1.5);
      ctx.lineTo(22 + b * 9, -96 - b * 2);
      ctx.stroke();
    }

    // гребень вдоль спины
    ctx.fillStyle = DR.ridge;
    for (var r = 0; r < 5; r++) {
      var rx = 10 + r * 8, ry = -136 - Math.sin(r / 4 * 3.14) * 6;
      ctx.beginPath();
      ctx.moveTo(rx, ry + 4);
      ctx.lineTo(rx + 4, ry - 9 - (r === 2 ? 3 : 0));
      ctx.lineTo(rx + 9, ry + 4);
      ctx.closePath();
      ctx.fill();
    }

    // 5. шея
    var nx1 = 46, ny1 = -130, na = -1.62;
    var seg = [[26, -1.62], [24, -1.32], [16, -0.92]];
    for (var n = 0; n < seg.length; n++) {
      na = seg[n][1] + Math.sin(p - n) * 0.05 * (run ? 1 : 0.4) - 0.1 * fly;
      var e = bone(nx1, ny1, na, seg[n][0], 20 - n * 3, DR.body);
      nx1 = e[0]; ny1 = e[1];
    }

    // 6. голова
    head(nx1 + 4, ny1 - 4, na + 1.25, 1);

    // 7. ближние лапы — светлее дальних, поэтому читается объём
    leg(24, -100, swing, fly, DR.body);
    arm(48, -118, swing, fly, DR.lit);

    // 8. ближнее крыло — поверх всего
    wing(34, -136, fly, flap, DR.body, DR.web);

    ctx.restore();
  }


  /* --- дракон 2: четвероногий, волчьего склада --------------------------
     Тот же приём с костями, но склад другой: длинное горизонтальное тело,
     четыре лапы вместо двух, волчий хвост и маленькие крылья, которые
     раскрываются только в прыжке. Бег — галоп: задняя пара толкает,
     передняя принимает, поэтому фазы у них разведены почти на полкруга.  */

  var WD = {
    far:   '#191114',        // дальняя пара лап — почти чёрная
    body:  '#241a1f',
    lit:   '#3b2830',
    belly: '#523138',
    red:   '#c0392b',
    hot:   '#ff6b3d',
    web:   'rgba(192,57,43,.82)',
    webFar:'rgba(112,30,25,.82)',
    claw:  '#e8dcd8',
    eye:   '#ff7a2f'
  };

  function claws(at, dir) {
    ctx.strokeStyle = WD.claw;
    ctx.lineWidth = 2.4;
    for (var i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(at[0], at[1]);
      ctx.lineTo(at[0] + dir * (5 + i), at[1] + 4 + i * 1.6);
      ctx.stroke();
    }
  }

  // Задняя лапа: бедро -> голень -> плюсна. В прыжке вытягивается назад.
  function wleg(hx, hy, sw, tuck, col) {
    var a1 = lerp(1.50 + sw * 0.45, 2.75, tuck);
    var a2 = lerp(2.00 - sw * 0.70, 2.95, tuck);
    var a3 = lerp(0.60 + sw * 0.45, 2.90, tuck);
    var k = bone(hx, hy, a1, 34, 13, col);
    var h = bone(k[0], k[1], a2, 32, 10, col);
    var f = bone(h[0], h[1], a3, 22, 8, col);
    claws(f, tuck > 0.5 ? -1 : 1);
  }

  // Передняя лапа: в прыжке поджимается под грудь.
  function warm(sx, sy, sw, tuck, col) {
    var a1 = lerp(1.35 - sw * 0.50, 2.30, tuck);
    var a2 = lerp(1.75 + sw * 0.55, -1.00, tuck);
    var a3 = lerp(1.50 + sw * 0.30, 0.55, tuck);
    var e = bone(sx, sy, a1, 34, 11, col);
    var w = bone(e[0], e[1], a2, 33, 9, col);
    var f = bone(w[0], w[1], a3, 18, 7, col);
    claws(f, 1);
  }

  function wolfdragon(t, run, fly, lift) {
    var p = run ? t * 8.5 : t * 2;
    var hind = Math.sin(p);
    var fore = Math.sin(p + 2.4);
    var flap = Math.sin(t * (fly > 0.5 ? 17 : 4));
    var bob = run ? Math.sin(p * 2) * 2.5 : Math.sin(t * 2) * 1.2;

    var k = Math.max(0, 1 - lift / 240);
    ctx.fillStyle = 'rgba(25,17,20,' + (0.24 * k) + ')';
    ctx.beginPath();
    ctx.ellipse(52, lift - 3, 56 * (0.55 + k * 0.45), 8 * k + 2, 0, 0, 6.3);
    ctx.fill();

    ctx.save();
    ctx.translate(50, -84 + bob);
    // В прыжке корпус вытягивается по дуге — как у волка в полёте.
    ctx.rotate(-0.2 * fly + (run ? Math.sin(p) * 0.04 : 0));
    ctx.translate(-50, 84);

    // 1. дальнее крыло
    wing(40, -102, fly, Math.sin(t * (fly > 0.5 ? 17 : 4) - 0.5),
         WD.far, WD.webFar, 0.62);

    // 2. хвост — длиннее волчьего, с волной по всей длине
    var tx = 12, ty = -86, ang = 3.24;
    for (var i = 0; i < 6; i++) {
      ang += 0.05 + Math.sin(p - i * 0.55) * 0.09 - fly * 0.03;
      var nx = tx + Math.cos(ang) * 11, ny = ty + Math.sin(ang) * 11;
      ctx.strokeStyle = i < 3 ? WD.body : WD.far;
      ctx.lineWidth = 13 - i * 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(nx, ny);
      ctx.stroke();
      tx = nx; ty = ny;
    }
    ctx.strokeStyle = WD.red;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(tx + 4, ty);
    ctx.lineTo(tx - 9, ty - 5);
    ctx.stroke();

    // 3. дальняя пара лап
    wleg(20, -84, -hind, fly, WD.far);
    warm(70, -92, -fore, fly, WD.far);

    // 4. корпус
    var g = ctx.createLinearGradient(0, -108, 0, -62);
    g.addColorStop(0, WD.lit);
    g.addColorStop(0.55, WD.body);
    g.addColorStop(1, WD.belly);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(10, -86);
    ctx.quadraticCurveTo(30, -106, 58, -103);
    ctx.quadraticCurveTo(80, -101, 88, -87);
    ctx.quadraticCurveTo(91, -73, 76, -68);
    ctx.quadraticCurveTo(46, -61, 20, -70);
    ctx.quadraticCurveTo(9, -75, 10, -86);
    ctx.fill();

    // красный гребень вдоль хребта
    ctx.fillStyle = WD.red;
    for (var r = 0; r < 6; r++) {
      var rx = 16 + r * 11, ry = -100 - Math.sin(r / 5 * 3.14) * 4;
      ctx.beginPath();
      ctx.moveTo(rx, ry + 3);
      ctx.lineTo(rx + 3, ry - 7);
      ctx.lineTo(rx + 7, ry + 3);
      ctx.closePath();
      ctx.fill();
    }
    // рёбра тлеющим по боку — чёрное тело иначе читается силуэтом без объёма
    ctx.strokeStyle = 'rgba(255,107,61,.35)';
    ctx.lineWidth = 2;
    for (var b = 0; b < 3; b++) {
      ctx.beginPath();
      ctx.moveTo(30 + b * 12, -72);
      ctx.lineTo(34 + b * 12, -88);
      ctx.stroke();
    }

    // 5. шея и голова
    var e1 = bone(72, -96, -0.85, 22, 17, WD.body);
    var e2 = bone(e1[0], e1[1], -0.5 - 0.15 * fly, 16, 14, WD.body);
    whead(e2[0] + 2, e2[1] - 1, 0.3 - 0.2 * fly);

    // 6. ближняя пара лап
    wleg(26, -84, hind, fly, WD.body);
    warm(76, -92, fore, fly, WD.lit);

    // 7. ближнее крыло поверх спины
    wing(48, -104, fly, flap, WD.body, WD.web, 0.62);

    ctx.restore();
  }

  function whead(x, y, ang) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);

    // уши торчком, как у волка
    ctx.fillStyle = WD.far;
    [[-6, -10], [-13, -8]].forEach(function (o) {
      ctx.beginPath();
      ctx.moveTo(o[0], o[1]);
      ctx.lineTo(o[0] - 3, o[1] - 16);
      ctx.lineTo(o[0] + 7, o[1] - 5);
      ctx.closePath();
      ctx.fill();
    });

    ctx.fillStyle = WD.body;
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 12, 0, 0, 6.3);
    ctx.fill();

    // морда длиннее и уже драконьей — волчья
    ctx.beginPath();
    ctx.moveTo(4, -9);
    ctx.quadraticCurveTo(24, -9, 33, -2);
    ctx.quadraticCurveTo(26, 4, 18, 5);
    ctx.lineTo(4, 8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = WD.belly;
    ctx.beginPath();
    ctx.moveTo(3, 5);
    ctx.quadraticCurveTo(16, 7, 25, 2);
    ctx.quadraticCurveTo(15, 12, 2, 11);
    ctx.closePath();
    ctx.fill();

    // рожки назад
    ctx.strokeStyle = WD.red;
    ctx.lineCap = 'round';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-2, -8);
    ctx.quadraticCurveTo(-16, -14, -24, -8);
    ctx.stroke();

    // глаз — единственное яркое пятно на чёрной морде
    var gg = ctx.createRadialGradient(7, -3, 1, 7, -3, 11);
    gg.addColorStop(0, 'rgba(255,150,80,.9)');
    gg.addColorStop(1, 'rgba(255,107,61,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(7, -3, 11, 0, 6.3);
    ctx.fill();
    ctx.fillStyle = WD.eye;
    ctx.beginPath();
    ctx.ellipse(7, -3, 5, 4, 0, 0, 6.3);
    ctx.fill();
    ctx.fillStyle = '#1b0f12';
    ctx.beginPath();
    ctx.ellipse(8, -3, 1.6, 3.4, 0, 0, 6.3);
    ctx.fill();

    ctx.fillStyle = '#1b0f12';
    ctx.beginPath();
    ctx.ellipse(27, -3, 2, 1.5, 0, 0, 6.3);
    ctx.fill();

    ctx.restore();
  }

  /* --- лего-дракон ------------------------------------------------------
     Собран по фотографии Алисиной постройки: фиолетовый змей без лап и
     без крыльев, длинное тело по земле, шея буквой S и голова с зелёным
     глазом, оранжевой мордой и зелёным кончиком носа.

     Рисуется прямоугольниками без единого скругления — он из кубиков, и
     угловатость это его характер, а не лень. Два прежних дракона гладкие,
     этот нарочно другой.

     Змею не нужны лапы: волна по телу идёт от головы к хвосту и сама
     читается как ползание. Поэтому здесь нет ни бёдер, ни стоп — только
     позвоночник. */

  var ЛЕГО = {
    тело:  '#6a4fa6',
    верх:  '#8f70cf',        // верхняя грань кубика — к свету
    низ:   '#42295f',        // нижняя — в тень
    глаз:  '#57a84a',
    глазВ: '#7cc96d',
    морда: '#b5652e',
    мордаВ:'#d4813f'
  };

  /* Один кубик: тело, светлая грань сверху, тёмная снизу. Три полоски
     вместо градиента — градиент на таком размере выглядит мылом. */
  function кубик(x, y, ш, в, цвет, светлый) {
    ctx.fillStyle = ЛЕГО.низ;
    ctx.fillRect(x, y, ш, в);
    ctx.fillStyle = цвет || ЛЕГО.тело;
    ctx.fillRect(x, y, ш, Math.max(1, в - 3));
    ctx.fillStyle = светлый || ЛЕГО.верх;
    ctx.fillRect(x, y, ш, Math.min(3, в));
  }

  /* Отклонение каждого звена шеи от прямой. Стоя это даёт ту самую
     лесенку вразбежку, что на фотографии, — не гладкую дугу. */
  var ШЕЯ = [0.34, -0.02, -0.28, -0.06, 0.18, 0.36];

  function legodragon(t, run, fly, lift, низко) {
    низко = низко || 0;
    var p = run ? t * 8.5 : t * 2;
    // В воздухе тело не волнуется: змей вытягивается в струну. Ползком,
    // наоборот, волна становится размашистее — этим он и ползёт.
    var amp = (run ? 1 : 0.35) * (1 - fly * 0.7) * (1 + низко * 1.1);

    // Тень. Длинная и узкая — под ним весь корпус, а не пара лап.
    var k = Math.max(0, 1 - lift / 240);
    ctx.fillStyle = 'rgba(25,17,20,' + (0.24 * k) + ')';
    ctx.beginPath();
    ctx.ellipse(50, lift - 3, (62 + низко * 26) * (0.55 + k * 0.45),
                8 * k + 2, 0, 0, 6.3);
    ctx.fill();

    // 1. тело: кубики вдоль позвоночника, от тонкого хвоста к толстой шее.
    // Ползком оно не сплющивается, а вытягивается: тело почти той же
    // толщины, просто длиннее и с более крутой волной.
    var N = 14, x0 = -38 - низко * 16, x1 = 62 + низко * 10;
    var шаг = (x1 - x0) / (N - 1) + 2;
    var базаШеи = 0;
    for (var i = 0; i < N; i++) {
      var kk = i / (N - 1);
      var x = x0 + (x1 - x0) * kk;
      // Горб посередине — он есть на фотографии, без него тело выходит
      // ровным клином и постройка не узнаётся. Лёжа горб уходит.
      var толщ = (9 + kk * 21 + Math.sin(kk * 3.14159) * 6) * (1 - низко * 0.22);
      // Волна бежит вдоль тела: у хвоста размашистая, у шеи почти нет.
      var волна = Math.sin(p - kk * 4.2) * (7 * (1 - kk) + 1) * amp;
      var верх = -2 - толщ + волна * 0.5;
      кубик(x, верх, шаг, толщ);
      if (i === N - 1) { базаШеи = верх + 2; }
    }

    // 2. шея звеньями. Стоя звенья смотрят вверх, ползком — вперёд, и
    // между этими двумя углами мы просто перетекаем. Поэтому дракон не
    // приплюснут по высоте, а по-настоящему укладывает шею на землю и
    // тянет голову перед собой.
    var nx = x1 - 2, ny = базаШеи;
    for (var j = 0; j < ШЕЯ.length; j++) {
      var стоя = -1.5708 + ШЕЯ[j];
      var лёжа = -0.06 + Math.sin(p - j * 0.8) * 0.16 * amp;
      var ang = стоя + (лёжа - стоя) * низко;
      // Лёжа звенья короче: иначе голова уезжает далеко вперёд рамки
      // столкновений и проходит сквозь камни, не задевая их.
      var шагЗвена = 14 - низко * 4;
      nx += Math.cos(ang) * шагЗвена;
      ny += Math.sin(ang) * шагЗвена;
      кубик(nx - 9, ny - 8, 18, 16);
    }

    // 3. голова. Отсчитываем от последнего звена, чтобы она не
    // отрывалась от шеи ни в одной позе.
    var hx = nx - 15, hy = ny + 5;
    кубик(hx, hy - 19, 48, 19);            // череп
    кубик(hx + 5, hy, 41, 12);             // нижняя челюсть
    кубик(hx + 26, hy - 22, 13, 9, ЛЕГО.глаз, ЛЕГО.глазВ);      // глаз
    кубик(hx + 12, hy + 1, 32, 8, ЛЕГО.морда, ЛЕГО.мордаВ);     // морда
    кубик(hx + 45, hy - 14, 11, 11, ЛЕГО.глаз, ЛЕГО.глазВ);     // кончик носа
  }

  /* --- список существ ---------------------------------------------------
     Каждая версия остаётся здесь навсегда: выбранная запоминается, к
     прошлой всегда можно вернуться. view — рамка, по которой считается
     превью на кнопке. */
  var КРЫЛАТЫЕ = [
    ['тап', 'прыжок с земли'],
    ['тап в воздухе', 'переходит в ровный полёт'],
    ['ведёшь пальцем', 'вверх — выше, вниз — ниже'],
    ['отпустил', 'падает'],
    ['навес', 'только сверху, перелететь']
  ];

  var БЕСКРЫЛЫЕ = [
    ['держишь палец', 'ложится и ползёт'],
    ['двойной тап', 'прыжок'],
    ['навес', 'только понизу, проползти'],
    ['летун', 'тоже проползти под ним']
  ];

  var BEASTS = [
    // крылья решают управление: с крыльями второе нажатие переходит в
    // ровный полёт, без крыльев одиночное нажатие прижимает к земле.
    // про и как — то, что показывает меню; сюда же, чтобы описание не
    // разъехалось с тем, кто нарисован.
    { id: 'dragon1', name: 'Дракон 1 · двуногий', w: 62, h: 190,
      крылья: true, view: [-52, -236, 100, 4], draw: dragon,
      про: 'Первый и самый высокий. Собран не из готовых фигур, а из ' +
           'костей: у каждой свой угол и длина, и каждая следующая растёт ' +
           'оттуда, где кончилась предыдущая. Поэтому бег и полёт у него — ' +
           'одно тело в разных позах, а не два разных рисунка.',
      как: КРЫЛАТЫЕ },
    { id: 'dragon2', name: 'Дракон 2 · волк', w: 100, h: 140,
      крылья: true, view: [-60, -158, 140, 6], draw: wolfdragon,
      про: 'Пониже и пошире: четыре лапы, волчий хвост и крылья. Ниже ' +
           'ростом, значит и щель под навесом ему нужна меньше — игра ' +
           'считает её от роста, а не одним числом на всех.',
      как: КРЫЛАТЫЕ },
    { id: 'lego', name: 'Дракон 3 · лего', w: 96, h: 150,
      // сам_ляжет — у него нарисована отдельная поза ползком, поэтому
      // общее сжатие к нему не применяется.
      крылья: false, сам_ляжет: true,
      view: [-44, -168, 172, 10], draw: legodragon,
      про: 'Собран по фотографии постройки Алисы: фиолетовый змей без ' +
           'лап и без крыльев, зелёный глаз, оранжевая морда. Рисуется ' +
           'одними прямоугольниками — он из кубиков. Летать не умеет, ' +
           'зато умеет то, чего не умеют другие: укладывается на землю и ' +
           'ползёт, вытянув шею вперёд.',
      как: БЕСКРЫЛЫЕ }
  ];

  var beastId = 'dragon1';
  try { beastId = localStorage.getItem('run-beast') || 'dragon1'; } catch (e) { /**/ }

  function beast() {
    for (var i = 0; i < BEASTS.length; i++) {
      if (BEASTS[i].id === beastId) { return BEASTS[i]; }
    }
    return BEASTS[0];
  }

  function drawHero() {
    ctx.save();
    ctx.translate(66, ground + hero.y);
    var сам = beast().сам_ляжет;
    // Ползком. Кто умеет укладываться сам — тот и укладывается: у змея
    // шея уходит вперёд, а не просто сплющивается. Остальным (и чужому
    // рисунку) поза не нарисована, поэтому им остаётся сжатие: начало
    // координат стоит на лапах, так что оно прижимает к земле, а не
    // топит в ней. По горизонтали слегка растягиваем, чтобы читалось
    // «распластался», а не «уменьшился».
    if (hero.низко > 0.002 && !сам) {
      var к = 1 - hero.низко * (1 - ПОЛЗКОМ);
      ctx.scale(1 + hero.низко * 0.3, к);
    }
    var running = state === 'run' && hero.onGround;
    beast().draw(hero.t, running, hero.fly, -hero.y, сам ? hero.низко : 0);
    ctx.restore();
  }

  function drawThing(o) {
    ctx.save();
    if (o.kind === 'arch') {
      // Навес: свисающая сверху балка на двух опорах по краям, просвет
      // внизу. Рисуем от нижнего края вверх.
      var низ = o.y, выс = o.h, ш = o.w;
      ctx.translate(o.x, 0);
      // Рисунок повторяет рамку столкновений один в один: если
      // нарисовать ажурную арку, а считать по прямоугольнику, игра
      // будет убивать за пустоту между опорами.
      ctx.fillStyle = mix([86, 70, 58], [44, 38, 34], night);
      ctx.fillRect(0, низ - выс, ш, выс);
      ctx.fillStyle = mix([104, 86, 70], [54, 46, 40], night);
      ctx.fillRect(0, низ - выс, ш * 0.34, выс);
      // Светлая кромка внизу — граница щели, в которую надо пролезть.
      ctx.fillStyle = mix([150, 176, 150], [70, 86, 78], night);
      ctx.fillRect(0, низ - 4, ш, 4);
    } else if (o.kind === 'bird') {
      ctx.translate(o.x + o.w / 2, o.y + o.h / 2 + Math.sin(o.t * 6) * 5);
      var flap = Math.sin(o.t * 14) * 9;
      ctx.fillStyle = '#6b5b8f';
      ctx.beginPath();
      ctx.ellipse(0, 0, 15, 8, 0, 0, 6.3);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-2, -2);
      ctx.lineTo(-18, -6 - flap);
      ctx.lineTo(-2, 5);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(2, -2);
      ctx.lineTo(16, -8 + flap);
      ctx.lineTo(4, 4);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(9, -2, 2, 0, 6.3);
      ctx.fill();
    } else {
      ctx.translate(o.x + o.w / 2, o.y);
      ctx.fillStyle = mix([90, 122, 88], [46, 62, 54], night);
      ctx.beginPath();
      ctx.moveTo(-o.w / 2, 0);
      ctx.quadraticCurveTo(-o.w / 3, -o.h, 0, -o.h);
      ctx.quadraticCurveTo(o.w / 3, -o.h, o.w / 2, 0);
      ctx.fill();
      ctx.fillStyle = mix([120, 156, 116], [60, 78, 68], night);
      ctx.beginPath();
      ctx.ellipse(0, -o.h, o.w / 2, 7, 0, 0, 6.3);
      ctx.fill();
    }
    ctx.restore();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) { last = now; }
    // Вкладка была свёрнута — не прокручиваем мир на весь простой.
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    step(dt);

    ctx.clearRect(0, 0, W, H);
    sky();
    land();

    ctx.globalAlpha = .5;
    ctx.fillStyle = '#fff';
    puffs.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, p.a);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.3);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    things.forEach(drawThing);
    drawHero();
  }

  /* --- выбор существа ---------------------------------------------------
     Превью рисуются тем же кодом, что и сама игра, поэтому картинка на
     кнопке не может разойтись с тем, кого увидишь на поле. */
  function paintBeast(c, b, cw, ch) {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    cw = cw || 62; ch = ch || 46;
    c.width = Math.round(cw * d);
    c.height = Math.round(ch * d);
    var g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    g.clearRect(0, 0, cw, ch);

    var vw = b.view[2] - b.view[0], vh = b.view[3] - b.view[1];
    var k = Math.min(cw / vw, ch / vh) * 0.94;
    // Функции рисования пишут в общий ctx — на время подменяем его.
    var save = ctx;
    ctx = g;
    g.save();
    g.translate(cw / 2 - (b.view[0] + b.view[2]) / 2 * k,
                ch / 2 - (b.view[1] + b.view[3]) / 2 * k);
    g.scale(k, k);
    b.draw(0.35, false, 0, 0, 0);
    g.restore();
    ctx = save;
  }

  /* Подсказка под заголовком. У крылатых и бескрылого управление разное,
     и одна общая строчка врала бы половине зверей. */
  function подсказка() {
    var el = document.getElementById('как');
    if (!el) { return; }
    el.textContent = крылатый()
      ? 'тап — прыжок, второй — полёт, веди пальцем'
      : 'держи — ползёт, двойной тап — прыжок';
  }

  /* --- меню -------------------------------------------------------------
     Три экрана в одной карточке: корень, список существ, карточка
     существа. Храним только имя экрана и, если нужно, чьё существо
     открыто, — а разметку каждый раз собираем заново. Так не бывает
     состояния «кнопка назад показана, а возвращаться некуда».

     Меню открывается и во время бега: тогда игра встаёт на паузу.
     Иначе, пока читаешь про дракона, тебя убивает камень. */
  var menu = document.getElementById('menu');
  var mbody = document.getElementById('mbody');
  var mtitle = document.getElementById('mtitle');
  var mback = document.getElementById('mback');
  var экран = 'корень';
  var открытоСущество = null;
  var былБег = false;

  function элемент(тег, класс, текст) {
    var e = document.createElement(тег);
    if (класс) { e.className = класс; }
    if (текст) { e.textContent = текст; }
    return e;
  }

  function строка(текст, подпись, вперёд) {
    var b = элемент('button', 'mrow');
    var box = элемент('span');
    box.appendChild(элемент('span', null, текст));
    if (подпись) { box.appendChild(элемент('small', null, подпись)); }
    b.appendChild(box);
    if (вперёд) { b.appendChild(элемент('i', null, '›')); }
    return b;
  }

  function рисоватьМеню() {
    mbody.innerHTML = '';
    mback.hidden = (экран === 'корень');

    if (экран === 'корень') {
      mtitle.textContent = 'Меню';
      // Пункт установки есть всегда: стоит игра — так и пишем, а не прячем.
      var готово = installed() && !offer;
      var inst = строка(готово ? 'Игра установлена' : 'Установить игру', 'Иконка на экране телефона', false);
      inst.className += ' install' + (готово ? ' done' : '');
      inst.disabled = готово;
      if (!готово) { inst.onclick = function () { install(inst); }; }
      mbody.appendChild(inst);
      var с = строка('Существа', beast().name, true);
      с.onclick = function () { экран = 'существа'; рисоватьМеню(); };
      mbody.appendChild(с);
      // Открыли игру своей иконкой, а нужно другое приложение — до хаба одно нажатие.
      var hub = строка('Все приложения (хаб)', null, false);
      hub.onclick = function () { location.href = window.облако.дом; };
      mbody.appendChild(hub);
      if (window.облако.вошли) {
        var out = строка('Выйти', null, false);
        out.onclick = function () { out.disabled = true; window.облако.выйти(); };
        mbody.appendChild(out);
      }
      return;
    }

    if (экран === 'существа') {
      mtitle.textContent = 'Существа';
      BEASTS.forEach(function (b) {
        var row = элемент('button', 'mrow' + (b.id === beastId ? ' on' : ''));
        var c = элемент('canvas');
        var box = элемент('span');
        box.appendChild(элемент('span', null, b.name));
        box.appendChild(элемент('small', null,
          b.крылья === false ? 'без крыльев · ползает' : 'с крыльями · летает'));
        row.appendChild(c);
        row.appendChild(box);
        row.appendChild(элемент('i', null, '›'));
        row.onclick = function () {
          открытоСущество = b.id;
          экран = 'существо';
          рисоватьМеню();
        };
        mbody.appendChild(row);
        paintBeast(c, b);      // размеры холста известны только после вставки
      });
      return;
    }

    // Карточка существа.
    var b2 = BEASTS[0];
    BEASTS.forEach(function (x) { if (x.id === открытоСущество) { b2 = x; } });
    mtitle.textContent = b2.name;

    var карта = элемент('div', 'mcard');
    var big = элемент('canvas');
    карта.appendChild(big);
    карта.appendChild(элемент('p', null, b2.про));
    карта.appendChild(элемент('h4', null, 'Механика'));

    var dl = элемент('dl');
    b2.как.forEach(function (пара) {
      dl.appendChild(элемент('dt', null, пара[0]));
      dl.appendChild(элемент('dd', null, пара[1]));
    });
    карта.appendChild(dl);

    var играть = элемент('button', 'mplay');
    var выбран = (b2.id === beastId);
    играть.textContent = выбран ? 'Уже выбран' : 'Играть за него';
    играть.disabled = выбран;
    играть.onclick = function () {
      beastId = b2.id;
      try { localStorage.setItem('run-beast', b2.id); } catch (e) { /**/ }
      window.облако.сохранить();
      подсказка();
      // Смена существа меняет рост, а от роста считаются щели в
      // препятствиях — те, что уже на поле, посчитаны под прежнего.
      // Поэтому забег начинаем заново, а не подменяем героя на ходу.
      былБег = false;
      state = 'menu';
      reset();
      document.getElementById('msg').className = '';
      document.getElementById('msg').innerHTML =
        '<b>Драконий бег</b><small id="как"></small>' +
        '<small style="opacity:.45">версия 6 · вход через хаб</small>';
      подсказка();
      закрытьМеню();
    };
    карта.appendChild(играть);

    mbody.appendChild(карта);
    paintBeast(big, b2, 300, 120);
  }

  /* --- установка на телефон ---
     Chrome присылает beforeinstallprompt, когда готов поставить игру; окно
     открыть можно только по нажатию. Не прислал (недавно отказались, другой
     браузер, игра открыта из хаба во встроенной вкладке) — подсказываем
     пункт его меню.
     «Установлено» пишем, только когда это видно: открыто с иконки, Chrome
     сам ответил по related_applications из манифеста, или установили только
     что. Раньше метка жила в localStorage и переживала удаление иконки: во
     вкладке из хаба Chrome установку не предлагает, стереть её было нечем
     (30.10.2026). */
  var offer = null;
  var known = false;
  try { localStorage.removeItem('run-installed'); } catch (e) { /**/ }
  // Открыто с иконки — только если запуск пришёл через start_url с меткой
  // ?installed (манифест). Чужая страница, открытая из окна установленного
  // хаба, тоже отвечает display-mode: standalone — окно-то хабовское, и меню
  // писало «установлено» там, где ничего не стоит (30.10.2026).
  var LAUNCH = 'run.launched';
  try {
    var launchUrl = new URL(location.href);
    if (launchUrl.searchParams.has('installed')) {
      sessionStorage.setItem(LAUNCH, '1');
      launchUrl.searchParams.delete('installed');
      history.replaceState(history.state, '', launchUrl.href);
    }
  } catch (e) { /* приват — считаем, что не с иконки */ }
  function standalone() {
    var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    try { return app && sessionStorage.getItem(LAUNCH) === '1'; } catch (e) { return false; }
  }
  function installed() {
    return standalone() || known;
  }
  function markInstalled() {
    known = true;
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    offer = e;
    known = false;
  });
  window.addEventListener('appinstalled', markInstalled);
  if (navigator.getInstalledRelatedApps) {
    navigator.getInstalledRelatedApps()
      .then(function (list) { if (list.length) { markInstalled(); } })
      .catch(function () { /* не умеет — считаем, что не установлено */ });
  }
  function install(row) {
    if (!offer) {
      row.querySelector('small').textContent = 'Chrome сейчас не предлагает сам: ⋮ в углу → «Добавить на главный экран». ' +
        'Открыто из хаба — сначала ⋮ → «Открыть в Chrome».';
      return;
    }
    закрытьМеню();
    offer.prompt();
    offer.userChoice.then(function (r) {
      offer = null;
      if (r.outcome === 'accepted') { markInstalled(); }
    });
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () { /* без офлайна, не беда */ });
  }

  function открытьМеню() {
    // Пауза: во время чтения мир стоять обязан.
    былБег = (state === 'run');
    if (былБег) { state = 'pause'; }
    экран = 'корень';
    menu.hidden = false;
    рисоватьМеню();
  }

  function закрытьМеню() {
    menu.hidden = true;
    if (былБег) {
      былБег = false;
      state = 'run';
      last = 0;              // иначе на паузе накопится огромный dt
    }
  }

  document.getElementById('burger').onclick = открытьМеню;
  document.getElementById('mclose').onclick = закрытьМеню;
  mback.onclick = function () {
    экран = (экран === 'существо') ? 'существа' : 'корень';
    рисоватьМеню();
  };
  // Тап по затемнению вокруг карточки — тоже закрыть.
  menu.onclick = function (e) { if (e.target === menu) { закрытьМеню(); } };

  /* Окошко наружу для автотестов. Всё остальное в игре спрятано внутри
     функции, и снаружи не видно ни высоты героя, ни препятствий — а
     проверять полёт по картинке на экране слишком хрупко. Только чтение,
     ничего изменить отсюда нельзя. */
  window.отладка = function () {
    return {
      состояние: state, y: hero.y, парит: hero.парит, цель: hero.цель,
      низко: hero.низко, наЗемле: hero.onGround, ползёт: hero.ползёт,
      земля: ground, очки: score, зверь: beastId, скорость: speed,
      вещи: things.map(function (o) {
        return { вид: o.kind, x: Math.round(o.x), y: Math.round(o.y), w: o.w, h: o.h };
      })
    };
  };

  fit();
  reset();
  подсказка();
  document.getElementById('best').textContent = 'рекорд ' + best;
  requestAnimationFrame(frame);
};
</script>
<script>
/* Облако: вход через хаб и сохранение на сервере.

   Играть можно только со входом: без пропуска и сеанса страница уходит
   на вход хаба. Сохраняется немного — рекорд и выбранный дракон. Рабочая
   копия в localStorage: с ней игра идёт и без сети. На сервере рекорд
   только растёт, поэтому два устройства одного аккаунта не спорят:
   остаётся больший. Открыли файл с диска — играем без хаба, как раньше. */
(function () {
  'use strict';

  var BEST = 'run-best', BEAST = 'run-beast';
  var OWNER = 'run-owner';   // чья копия на этом устройстве
  var DIRTY = 'run-dirty';   // '1' — изменения ещё не на сервере

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) {
    try { if (v === null) { localStorage.removeItem(k); } else { localStorage.setItem(k, v); } }
    catch (e) { /* приват — играем без памяти */ }
  }

  // Адреса хаба: из <meta name="hub-id|hub-home">, если страница их задала
  // (так делает пробный стенд), иначе game.example.com -> id.example.com.
  function hubUrl(name, sub) {
    var meta = document.querySelector('meta[name="' + name + '"]');
    if (meta && meta.content) { return meta.content.replace(/\/$/, ''); }
    return location.protocol + '//' + location.hostname.replace(/^[^.]+/, sub);
  }
  var ID_URL = hubUrl('hub-id', 'id');
  var HOME_URL = hubUrl('hub-home', 'hub');

  function loginUrl() {
    return HOME_URL + '/?app=game&next=' + encodeURIComponent(location.href);
  }

  // Несколько запросов на просроченном пропуске ждут одно обновление.
  var renewing = null;
  function renewPass() {
    if (!renewing) {
      renewing = fetch(ID_URL + '/api/auth/refresh', { method: 'POST', credentials: 'include' })
        .then(function (r) { renewing = null; return r.ok; },
              function () { renewing = null; return false; });
    }
    return renewing;
  }

  // 401 — короткий пропуск истёк, 403 — пропуск выдан до того, как игра
  // вошла в хаб. Оба лечатся новым пропуском: берём и повторяем один раз.
  // Без 403 тут страница ходила бы по кругу через вход (филворд, 30.10.2026).
  var NEED_LOGIN = 'need-login';
  function api(method, body) {
    var opts = { method: method, credentials: 'same-origin', cache: 'no-store', headers: {} };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    function denied(r) { return r.status === 401 || r.status === 403; }
    return fetch('/api/save', opts).then(function (r) {
      if (!denied(r)) { return r; }
      return renewPass().then(function (ok) { return ok ? fetch('/api/save', opts) : r; });
    }).then(function (r) {
      if (denied(r)) { throw new Error(NEED_LOGIN); }
      return r;
    });
  }

  function localBest() { return parseInt(get(BEST) || '0', 10) || 0; }

  var owner = null;
  var sending = null;

  // Отправить, что есть на устройстве. Сервер вернёт больший из рекордов.
  function push() {
    if (!owner) { return Promise.resolve(); }
    if (sending) { return sending.then(push); }
    set(DIRTY, '1');
    sending = api('PUT', { best: localBest(), beast: get(BEAST) || 'dragon1' })
      .then(function (r) {
        if (!r.ok) { throw new Error('save ' + r.status); }
        return r.json();
      })
      .then(function (saved) {
        if (saved.best > localBest()) { set(BEST, String(saved.best)); }
        set(DIRTY, null);
      })
      .catch(function (err) {
        if (err.message === NEED_LOGIN) { location.replace(loginUrl()); }
        // Нет сети — копия остаётся помеченной, уйдёт со следующим сохранением.
      })
      .then(function () { sending = null; });
    return sending;
  }

  window.облако = {
    вошли: false,
    дом: HOME_URL + '/',
    // Игра записала рекорд или дракона в localStorage — отправить на сервер.
    сохранить: push,
    // Вход общий на все приложения хаба. Сначала неотправленное, потом копия
    // на устройстве стирается: следующий, кто войдёт, не увидит чужой рекорд.
    выйти: function () {
      var first = get(DIRTY) === '1' ? push() : Promise.resolve();
      return first.then(function () {
        if (get(DIRTY) !== '1') { [BEST, BEAST, OWNER, DIRTY].forEach(function (k) { set(k, null); }); }
        return fetch(ID_URL + '/api/auth/logout', { method: 'POST', credentials: 'include' })
          .catch(function () { /* сеть — выйдем всё равно */ });
      }).then(function () { location.replace(HOME_URL + '/'); });
    }
  };

  if (location.protocol === 'file:') { window.игра(); return; }

  addEventListener('online', function () { if (get(DIRTY) === '1') { push(); } });

  api('GET').then(function (r) {
    if (!r.ok) { throw new Error('load ' + r.status); }
    return r.json();
  }).then(function (server) {
    owner = server.owner;
    window.облако.вошли = true;
    var save = server.save;
    var mine = get(OWNER);
    if (mine && mine !== owner) {
      // Копия на устройстве — от другого аккаунта: она не наша.
      [BEST, BEAST, DIRTY].forEach(function (k) { set(k, null); });
    }
    // Копия без хозяина — рекорд, набранный до входа через хаб: он тоже идёт на сервер.
    var unsent = get(DIRTY) === '1' || (!mine && localBest() > 0);
    if (save) {
      if (save.best > localBest()) { set(BEST, String(save.best)); }
      if (!unsent || !get(BEAST)) { set(BEAST, save.beast); }
    }
    set(OWNER, owner);
    if (unsent || (save && localBest() > save.best)) { push(); }
    window.игра();
  }, function (err) {
    if (err.message === NEED_LOGIN) { location.replace(loginUrl()); return; }
    // Сервер не ответил (нет сети): играем по копии, на сервер она уйдёт позже.
    owner = get(OWNER);
    window.облако.вошли = !!owner;
    window.игра();
  });
}());
</script>
</body>
